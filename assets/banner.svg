<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.7; }
        50% { r: 7.5; opacity: 1; }
      }

      .orb1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 250px 120px; }
      .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 950px 300px; }
      .flow-line { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
      .pill-float-1 { animation: floatSlow 4s ease-in-out infinite; }
      .pill-float-2 { animation: floatReverse 4.5s ease-in-out infinite; }
      .pulsing-node { animation: nodePulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay (Background) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Ambient Glowing Orbs (Deep Background) -->
  <circle cx="220" cy="110" r="140" fill="#2563eb" filter="url(#glow)" class="orb1" />
  <circle cx="980" cy="300" r="160" fill="#059669" filter="url(#glow)" class="orb2" />
  <circle cx="600" cy="210" r="110" fill="#0284c7" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Animated Payment Flow Rails (Background decorative layer) -->
  <g fill="none" stroke-width="2.5">
    <!-- Payment rail line 1 -->
    <path d="M 80 340 C 300 370, 450 310, 680 340 C 880 365, 1020 310, 1120 330" 
          stroke="url(#flowGrad)" class="flow-line" opacity="0.5" />
    <!-- Payment rail line 2 -->
    <path d="M 100 80 C 260 50, 420 100, 620 70 C 840 40, 1000 95, 1100 70" 
          stroke="url(#flowGrad)" class="flow-line" opacity="0.35" style="animation-direction: reverse;" />
  </g>

  <!-- Decorative Interactive Floating Feature Pills (Lower Background Layer) -->
  <g class="pill-float-1" opacity="0.85">
    <g transform="translate(140, 310)">
      <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#60a5fa" class="pulsing-node" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">ACH &amp; RTP Rails</text>
    </g>
    <g transform="translate(900, 75)">
      <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#34d399" class="pulsing-node" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Double-Entry Ledgers</text>
    </g>
  </g>

  <g class="pill-float-2" opacity="0.85">
    <g transform="translate(910, 310)">
      <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" class="pulsing-node" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Multi-Party Payouts</text>
    </g>
    <g transform="translate(130, 75)">
      <rect width="145" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#a78bfa" class="pulsing-node" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">KYC / KYB Compliance</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content card container backdrop ensuring crisp high-contrast legibility -->
  <g transform="translate(240, 120)">
    <rect width="720" height="175" rx="14" fill="#090d16" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Category Tag -->
    <text x="360" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2.5">
      FINTECH &amp; EMBEDDED FINANCE DIRECTORY
    </text>

    <!-- Main Title (Strictly Foregrounded & Shadowed) -->
    <text x="360" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="url(#textGrad)">
      Awesome Embedded B2B Payments
    </text>

    <!-- Subtitle (Clear, readable, unaffected by background dynamic elements) -->
    <text x="360" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
      Curated Platforms • Split Payouts • Bank Rails • Open-Source Ledgers
    </text>

    <!-- Bottom Feature Badges -->
    <text x="360" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">
      ⚡ Real-Time Processing &nbsp;•&nbsp; 🔒 Bank-Grade Security &nbsp;•&nbsp; 🌐 SaaS &amp; Open-Source
    </text>
  </g>

  <!-- Border Accent Outline -->
  <rect width="1196" height="416" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
